name: Package AlmaLinux 9 (EL9)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
  TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  TARGET_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
  REAPER_REPO_ID: reaper-rhel-9-stable
  REAPER_REPO_URL: https://johngrimmreaper.github.io/rpm-packages/repo/reaper-rhel-9-stable.repo
  REAPER_BASEURL: https://johngrimmreaper.github.io/rpm-packages/stable/rhel/9/$basearch
  REAPER_GPGKEY_URL: https://johngrimmreaper.github.io/rpm-packages/RPM-GPG-KEY

defaults:
  run:
    shell: bash

concurrency:
  group: package-rhel-9-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build RPM on AlmaLinux 9
    runs-on: ubuntu-24.04
    container:
      image: almalinux:9
    timeout-minutes: 60

    steps:
      - name: Bootstrap container
        run: |
          set -euxo pipefail
          dnf -y install ca-certificates curl git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record build provenance
        run: |
          set -euxo pipefail
          mkdir -p out/evidence
          checked_out_sha="$(git rev-parse HEAD)"
          test "$checked_out_sha" = "$TARGET_SHA"

          cat /etc/os-release | tee out/evidence/os-release.txt
          uname -a | tee out/evidence/uname.txt
          rpm --eval '%{_arch}' | tee out/evidence/rpm-arch.txt
          git status --short --branch | tee out/evidence/git-status.txt
          git show -s --format='commit=%H%ncommit_timestamp=%ct%ncommit_date=%cI%nauthor=%an <%ae>%nsubject=%s' "$TARGET_SHA" \
            | tee out/evidence/git-commit.txt
          printf 'event=%s\nrepository=%s\nref=%s\ntarget_sha=%s\ngithub_sha=%s\n' \
            "$GITHUB_EVENT_NAME" "$TARGET_REPOSITORY" "$TARGET_REF" "$TARGET_SHA" "$GITHUB_SHA" \
            | tee out/evidence/workflow-source.txt

      - name: Enable AlmaLinux 9 build repositories
        run: |
          set -euxo pipefail
          dnf -y install dnf-plugins-core epel-release
          dnf config-manager --set-enabled crb
          dnf -y makecache
          dnf repolist --enabled | tee out/evidence/almalinux-repositories.txt

      - name: Install and validate signed Reaper EL9 repository
        run: |
          set -euxo pipefail
          repo_file="/etc/yum.repos.d/${REAPER_REPO_ID}.repo"

          curl --fail --show-error --location --retry 3 \
            --proto '=https' --tlsv1.2 \
            --output "$repo_file" \
            "$REAPER_REPO_URL"
          cat "$repo_file" | tee out/evidence/reaper-repository.txt

          test "$(grep -c '^\['"$REAPER_REPO_ID"'\]$' "$repo_file")" -eq 1
          test "$(grep -c '^enabled=1$' "$repo_file")" -eq 1
          test "$(grep -c '^gpgcheck=1$' "$repo_file")" -eq 1
          test "$(grep -c '^repo_gpgcheck=1$' "$repo_file")" -eq 1
          test "$(grep -Fc "baseurl=$REAPER_BASEURL" "$repo_file")" -eq 1
          test "$(grep -Fc "gpgkey=$REAPER_GPGKEY_URL" "$repo_file")" -eq 1
          ! grep -Eq '^(gpgcheck|repo_gpgcheck|sslverify)=(0|false|no)$' "$repo_file"

          curl --fail --show-error --location --retry 3 \
            --proto '=https' --tlsv1.2 \
            --output /tmp/RPM-GPG-KEY \
            "$REAPER_GPGKEY_URL"
          sha256sum /tmp/RPM-GPG-KEY | tee out/evidence/reaper-gpg-key.sha256
          rpm --import /tmp/RPM-GPG-KEY
          rpm -qa 'gpg-pubkey*' | sort | tee out/evidence/imported-gpg-keys.txt

          dnf -y --disablerepo='*' --enablerepo="$REAPER_REPO_ID" makecache \
            2>&1 | tee out/evidence/reaper-makecache.log
          dnf repolist --enabled | tee out/evidence/enabled-repositories.txt
          dnf repolist --enabled | awk 'NR > 1 {print $1}' | grep -Fx "$REAPER_REPO_ID"

      - name: Install RPM build tooling
        run: |
          set -euxo pipefail
          dnf -y install rpm-build rpmdevtools rpmlint
          rpm --version
          rpmbuild --version
          rpmlint --version
          command -v spectool

      - name: Prepare CI spec for exact checkout
        run: |
          set -euxo pipefail
          test -f pkg/rpm/NsCDE.spec
          rpmdev-setuptree

          canonical_source="$(spectool -S pkg/rpm/NsCDE.spec | awk '$1 == "Source0:" { print $2; exit }')"
          test -n "$canonical_source"
          printf 'Canonical checked-in Source0: %s\n' "$canonical_source" \
            | tee out/evidence/canonical-source0.txt
          case "$canonical_source" in
            https://github.com/NsCDE/NsCDE/archive/*) ;;
            *)
              printf 'ERROR: checked-in Source0 is no longer the canonical upstream GitHub archive URL: %s\n' "$canonical_source" >&2
              exit 1
              ;;
          esac

          spec="$HOME/rpmbuild/SPECS/NsCDE.spec"
          cp -v pkg/rpm/NsCDE.spec "$spec"

          short_sha="${TARGET_SHA:0:7}"
          commit_epoch="$(git show -s --format=%ct "$TARGET_SHA")"
          snapshot_date="$(date -u -d "@$commit_epoch" +%Y%m%d)"

          sed -i -E \
            -e "s|^%global commit[[:space:]]+.*$|%global commit ${TARGET_SHA}|" \
            -e "s|^%global shortcommit[[:space:]]+.*$|%global shortcommit ${short_sha}|" \
            -e "s|^%global snapshot_date[[:space:]]+.*$|%global snapshot_date ${snapshot_date}|" \
            -e "s|^Source0:.*$|Source0: https://github.com/${TARGET_REPOSITORY}/archive/%{commit}/%{name}-%{commit}.tar.gz|" \
            "$spec"

          cp -v "$spec" out/evidence/NsCDE.ci.spec
          git diff --exit-code -- pkg/rpm/NsCDE.spec

          expanded_source="$(spectool -S "$spec" | awk '$1 == "Source0:" { print $2; exit }')"
          expanded_release="$(rpmspec -q --qf '%{RELEASE}\n' "$spec" | head -n1)"
          printf 'CI Source0: %s\nCI Release: %s\n' "$expanded_source" "$expanded_release" \
            | tee out/evidence/ci-spec-provenance.txt

          case "$expanded_source" in
            "https://github.com/${TARGET_REPOSITORY}/archive/${TARGET_SHA}/NsCDE-${TARGET_SHA}.tar.gz") ;;
            *)
              printf 'ERROR: CI Source0 does not identify the exact target repository and SHA: %s\n' "$expanded_source" >&2
              exit 1
              ;;
          esac
          case "$expanded_release" in
            "0.1.${snapshot_date}git${short_sha}."*) ;;
            *)
              printf 'ERROR: CI Release does not identify the exact target SHA/date: %s\n' "$expanded_release" >&2
              exit 1
              ;;
          esac

      - name: Inspect RPM packaging metadata
        run: |
          set -euxo pipefail
          spec="$HOME/rpmbuild/SPECS/NsCDE.spec"
          rpmspec -q --qf 'Name: %{NAME}\nVersion: %{VERSION}\nRelease: %{RELEASE}\nArch: %{ARCH}\n' "$spec" \
            | tee out/evidence/spec-packages.txt
          printf '\nDeclared sources:\n'
          spectool -S "$spec" | tee out/evidence/spec-sources.txt
          printf '\nDeclared build requirements:\n'
          rpmspec -q --buildrequires "$spec" | sort -u | tee out/evidence/buildrequires.txt

      - name: Verify Reaper FVWM dependency chain
        run: |
          set -euxo pipefail
          arch="$(rpm --eval '%{_arch}')"
          for dependency in fvwm xlockmore; do
            printf '\nAll enabled-repository candidates for %s:\n' "$dependency"
            dnf -q repoquery --available \
              --qf '%{name}|%{version}-%{release}|%{arch}|%{repoid}' \
              "$dependency" \
              | LC_ALL=C sort \
              | tee "out/evidence/${dependency}-all-candidates.txt"

            printf '\nReaper EL9 candidates for %s:\n' "$dependency"
            dnf -q repoquery \
              --disablerepo='*' \
              --enablerepo="$REAPER_REPO_ID" \
              --available \
              --arch="$arch" \
              --qf '%{name}|%{version}-%{release}|%{arch}|%{repoid}' \
              "$dependency" \
              | LC_ALL=C sort \
              | tee "out/evidence/${dependency}-reaper-candidates.txt"

            test -s "out/evidence/${dependency}-reaper-candidates.txt"
            awk -F'|' -v repo="$REAPER_REPO_ID" 'NF != 5 || $5 != repo { bad=1 } END { exit bad }' \
              "out/evidence/${dependency}-reaper-candidates.txt"
          done

      - name: Install spec BuildRequires
        run: |
          set -euxo pipefail
          dnf -y builddep "$HOME/rpmbuild/SPECS/NsCDE.spec"

      - name: Create deterministic source archive from exact checkout
        run: |
          set -euxo pipefail
          spec="$HOME/rpmbuild/SPECS/NsCDE.spec"
          source_url="$(spectool -S "$spec" | awk '$1 == "Source0:" { print $2; exit }')"
          source_file="${source_url##*/}"
          expected_file="NsCDE-${TARGET_SHA}.tar.gz"

          test "$source_file" = "$expected_file"
          archive_root="${source_file%.tar.gz}"
          test "$archive_root" = "NsCDE-${TARGET_SHA}"

          printf 'Packaging repository: %s\n' "$TARGET_REPOSITORY"
          printf 'Packaging exact commit: %s\n' "$TARGET_SHA"
          printf 'CI Source0: %s\n' "$source_url"
          printf 'Archive root: %s/\n' "$archive_root"

          git archive --format=tar --prefix="${archive_root}/" "$TARGET_SHA" \
            | gzip -n > "$HOME/rpmbuild/SOURCES/$source_file"

          test -s "$HOME/rpmbuild/SOURCES/$source_file"
          sha256sum "$HOME/rpmbuild/SOURCES/$source_file" \
            | tee out/evidence/source-archive.sha256
          tar -tzf "$HOME/rpmbuild/SOURCES/$source_file" \
            | awk -F/ -v root="$archive_root" '$1 != root { bad=1 } END { exit bad }'
          tar -tzf "$HOME/rpmbuild/SOURCES/$source_file" | sed -n '1,20p' \
            | tee out/evidence/source-archive-head.txt

      - name: Build binary and source RPMs
        run: |
          set -euxo pipefail
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$TARGET_SHA")"
          printf 'RPM build PATH: %s\n' "$PATH"
          printf 'SOURCE_DATE_EPOCH: %s\n' "$SOURCE_DATE_EPOCH"
          for command_name in python3 ksh93 ksh; do
            if command -v "$command_name" >/dev/null 2>&1; then
              command_path="$(command -v "$command_name")"
              printf '%s -> %s\n' "$command_name" "$command_path"
              type -a "$command_name" || true
              ls -l "$command_path"
              rpm -qf "$command_path" || true
            fi
          done
          rpmbuild -ba "$HOME/rpmbuild/SPECS/NsCDE.spec"

      - name: Collect and inspect RPM artifacts
        run: |
          set -euxo pipefail
          find "$HOME/rpmbuild/RPMS" "$HOME/rpmbuild/SRPMS" \
            -type f -name '*.rpm' -exec cp -v '{}' out/ ';'

          mapfile -t binaries < <(find out -maxdepth 1 -type f -name '*.rpm' ! -name '*.src.rpm' -print | sort)
          mapfile -t srpms < <(find out -maxdepth 1 -type f -name '*.src.rpm' -print | sort)
          test "${#binaries[@]}" -gt 0
          test "${#srpms[@]}" -eq 1

          printf 'Generated RPMs:\n' | tee out/evidence/rpm-nevra.txt
          for package in out/*.rpm; do
            rpm -qp --qf '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\n' "$package" \
              | tee -a out/evidence/rpm-nevra.txt
          done

          short_sha="${TARGET_SHA:0:7}"
          commit_epoch="$(git show -s --format=%ct "$TARGET_SHA")"
          snapshot_date="$(date -u -d "@$commit_epoch" +%Y%m%d)"
          main_rpm="$(find out -maxdepth 1 -type f -name 'NsCDE-*.rpm' ! -name '*.src.rpm' ! -name 'NsCDE-*-*.noarch.rpm' -print -quit)"
          test -n "$main_rpm"
          main_release="$(rpm -qp --qf '%{RELEASE}' "$main_rpm")"
          case "$main_release" in
            "0.1.${snapshot_date}git${short_sha}."*) ;;
            *)
              printf 'ERROR: built RPM release does not identify target SHA/date: %s\n' "$main_release" >&2
              exit 1
              ;;
          esac

          printf '\nGenerated binary RPM requirements:\n' | tee out/evidence/binary-requires.txt
          for package in "${binaries[@]}"; do
            printf '\n%s:\n' "$package" | tee -a out/evidence/binary-requires.txt
            rpm -qp --requires "$package" | sort -u | tee -a out/evidence/binary-requires.txt
          done

          printf '\nSRPM metadata:\n'
          rpm -qpi "${srpms[0]}" | tee out/evidence/srpm-info.txt
          sha256sum out/*.rpm | tee out/evidence/rpm-artifacts.sha256

      - name: Run rpmlint and preserve findings
        run: |
          set -uxo pipefail
          set +e
          rpmlint "$HOME/rpmbuild/SPECS/NsCDE.spec" out/*.rpm 2>&1 \
            | tee out/evidence/rpmlint.txt
          rpmlint_status="${PIPESTATUS[0]}"
          set -e
          printf '%s\n' "$rpmlint_status" | tee out/evidence/rpmlint.exit-code.txt
          if (( rpmlint_status != 0 )); then
            printf 'rpmlint reported existing RPM packaging findings; they are retained as CI evidence and are not a pipeline failure.\n'
          fi

      - name: Upload RPM artifacts and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nscde-rhel-9-${{ env.TARGET_SHA }}
          path: |
            out/*.rpm
            out/evidence/**
          if-no-files-found: error
          retention-days: 30

  install-test:
    name: Install RPM on clean AlmaLinux 9
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: almalinux:9
    timeout-minutes: 60

    steps:
      - name: Bootstrap runtime container
        run: |
          set -euxo pipefail
          mkdir -p runtime-evidence
          cat /etc/os-release | tee runtime-evidence/os-release.txt
          grep -E '^[[:space:]]*tsflags=' /etc/dnf/dnf.conf \
            | tee runtime-evidence/dnf-container-tsflags.txt || true
          dnf -y install ca-certificates curl dnf-plugins-core epel-release \
            2>&1 | tee runtime-evidence/repository-bootstrap.log
          dnf config-manager --set-enabled crb \
            2>&1 | tee runtime-evidence/enable-crb.log

      - name: Install and validate signed Reaper EL9 runtime repository
        run: |
          set -euxo pipefail
          repo_file="/etc/yum.repos.d/${REAPER_REPO_ID}.repo"

          curl --fail --show-error --location --retry 3 \
            --proto '=https' --tlsv1.2 \
            --output "$repo_file" \
            "$REAPER_REPO_URL"
          cat "$repo_file" | tee runtime-evidence/reaper-repository.txt

          test "$(grep -c '^\['"$REAPER_REPO_ID"'\]$' "$repo_file")" -eq 1
          test "$(grep -c '^enabled=1$' "$repo_file")" -eq 1
          test "$(grep -c '^gpgcheck=1$' "$repo_file")" -eq 1
          test "$(grep -c '^repo_gpgcheck=1$' "$repo_file")" -eq 1
          test "$(grep -Fc "baseurl=$REAPER_BASEURL" "$repo_file")" -eq 1
          test "$(grep -Fc "gpgkey=$REAPER_GPGKEY_URL" "$repo_file")" -eq 1
          ! grep -Eq '^(gpgcheck|repo_gpgcheck|sslverify)=(0|false|no)$' "$repo_file"

          curl --fail --show-error --location --retry 3 \
            --proto '=https' --tlsv1.2 \
            --output /tmp/RPM-GPG-KEY \
            "$REAPER_GPGKEY_URL"
          sha256sum /tmp/RPM-GPG-KEY | tee runtime-evidence/reaper-gpg-key.sha256
          rpm --import /tmp/RPM-GPG-KEY
          rpm -qa 'gpg-pubkey*' | sort | tee runtime-evidence/imported-gpg-keys.txt

          dnf -y --disablerepo='*' --enablerepo="$REAPER_REPO_ID" makecache \
            2>&1 | tee runtime-evidence/reaper-makecache.log
          dnf -y makecache
          dnf repolist --enabled | tee runtime-evidence/enabled-repositories.txt
          dnf repolist --enabled | awk 'NR > 1 {print $1}' | grep -Fx "$REAPER_REPO_ID"

      - name: Download RPM artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nscde-rhel-9-${{ env.TARGET_SHA }}
          path: artifacts

      - name: Verify source provenance evidence
        run: |
          set -euxo pipefail
          test -f artifacts/evidence/workflow-source.txt
          grep -Fx "repository=${TARGET_REPOSITORY}" artifacts/evidence/workflow-source.txt
          grep -Fx "target_sha=${TARGET_SHA}" artifacts/evidence/workflow-source.txt

      - name: Verify Reaper runtime dependency candidates
        run: |
          set -euxo pipefail
          arch="$(rpm --eval '%{_arch}')"
          for dependency in fvwm xlockmore; do
            dnf -q repoquery \
              --disablerepo='*' \
              --enablerepo="$REAPER_REPO_ID" \
              --available \
              --arch="$arch" \
              --qf '%{name}|%{version}-%{release}|%{arch}|%{repoid}' \
              "$dependency" \
              | LC_ALL=C sort \
              | tee "runtime-evidence/${dependency}-reaper-candidates.txt"
            test -s "runtime-evidence/${dependency}-reaper-candidates.txt"
            awk -F'|' -v repo="$REAPER_REPO_ID" 'NF != 5 || $5 != repo { bad=1 } END { exit bad }' \
              "runtime-evidence/${dependency}-reaper-candidates.txt"
          done

      - name: Install generated binary RPMs with normal DNF resolution
        run: |
          set -euxo pipefail
          mapfile -t packages < <(find artifacts -type f -name '*.rpm' ! -name '*.src.rpm' -print | sort)
          test "${#packages[@]}" -gt 0
          printf 'Installing local CI RPMs:\n%s\n' "${packages[@]}"
          dnf -y \
            --setopt=install_weak_deps=False \
            --setopt=tsflags= \
            install "${packages[@]}" \
            2>&1 | tee runtime-evidence/runtime-install.log
          dnf history info last | tee runtime-evidence/runtime-dnf-history.txt

      - name: Verify installed packages and dependency provenance
        run: |
          set -euxo pipefail
          mapfile -t package_names < <(
            find artifacts -type f -name '*.rpm' ! -name '*.src.rpm' \
              -exec rpm -qp --qf '%{NAME}\n' '{}' ';' | sort -u
          )
          test "${#package_names[@]}" -gt 0
          for package_name in "${package_names[@]}"; do
            rpm -q "$package_name"
            rpm -V "$package_name"

            artifact_nevra="$(find artifacts -type f -name '*.rpm' ! -name '*.src.rpm' -exec sh -c 'test "$(rpm -qp --qf "%{NAME}" "$1")" = "$2" && rpm -qp --qf "%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}" "$1"' _ '{}' "$package_name" ';' | head -n1)"
            installed_nevra="$(rpm -q --qf '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}' "$package_name")"
            test -n "$artifact_nevra"
            test "$installed_nevra" = "$artifact_nevra"
          done

          short_sha="${TARGET_SHA:0:7}"
          nscde_release="$(rpm -q --qf '%{RELEASE}' NsCDE)"
          case "$nscde_release" in
            *"git${short_sha}"*) ;;
            *)
              printf 'ERROR: installed NsCDE does not identify target SHA %s: %s\n' "$TARGET_SHA" "$nscde_release" >&2
              exit 1
              ;;
          esac

          rpm -q fvwm xlockmore | tee runtime-evidence/installed-window-manager-dependencies.txt
          for dependency in fvwm xlockmore; do
            installed_candidate="$(rpm -q --qf '%{NAME}|%{VERSION}-%{RELEASE}|%{ARCH}' "$dependency")"
            grep -Fx "${installed_candidate}|${REAPER_REPO_ID}" \
              "runtime-evidence/${dependency}-reaper-candidates.txt"

            LC_ALL=C dnf info installed "$dependency" \
              | tee "runtime-evidence/${dependency}-installed-info.txt"
            grep -Eq "^[[:space:]]*From repo[[:space:]]*:[[:space:]]*${REAPER_REPO_ID}[[:space:]]*$" \
              "runtime-evidence/${dependency}-installed-info.txt"
          done

          dnf -y check | tee runtime-evidence/dnf-check.txt

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nscde-rhel-9-runtime-${{ env.TARGET_SHA }}
          path: runtime-evidence/**
          if-no-files-found: warn
          retention-days: 30
