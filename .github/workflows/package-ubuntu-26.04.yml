name: NsCDE package CI - Ubuntu 26.04

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
  TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  DEBIAN_FRONTEND: noninteractive

concurrency:
  group: nscde-deb-ubuntu-26.04-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and diagnose NsCDE DEBs on Ubuntu 26.04
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ubuntu:26.04

    steps:
      - name: Show pristine Ubuntu 26.04 container
        shell: bash
        run: |
          set -Eeuo pipefail
          cat /etc/os-release
          uname -a
          printf 'CPUs: %s\n' "$(nproc)"
          printf 'Architecture: %s\n' "$(dpkg --print-architecture)"
          df -h /

      - name: Install DEB build prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 upgrade -y
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential ca-certificates devscripts dpkg-dev equivs fakeroot \
            file findutils git passwd python3 util-linux
          apt-get clean

      - name: Check out exact NsCDE commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Trust GitHub checkout mount inside container
        shell: bash
        run: |
          set -Eeuo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Show NsCDE commit under test
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git show --no-patch \
            --format='commit:    %H%nauthor:    %an <%ae>%nauthor date: %aI%ncommitter: %cn <%ce>%ncommit date: %cI%nsubject:   %s' HEAD
          git status --short --branch

      - name: Simulate a fresh local Git clone for packaging
        shell: bash
        run: |
          set -Eeuo pipefail
          useradd --create-home --shell /bin/bash nscdebuild
          source_tree=/home/nscdebuild/nscde-code
          target_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          rm -rf "$source_tree"
          git clone --no-local --no-checkout "$GITHUB_WORKSPACE" "$source_tree"
          git -C "$source_tree" checkout --detach "$target_sha"
          seed_tree="$(git -C "$GITHUB_WORKSPACE" rev-parse 'HEAD^{tree}')"
          clone_tree="$(git -C "$source_tree" rev-parse 'HEAD^{tree}')"
          printf 'CI seed tree: %s\nlocal clone:  %s\n' "$seed_tree" "$clone_tree"
          test "$seed_tree" = "$clone_tree"
          test -z "$(git -C "$source_tree" status --porcelain)"
          chown -R nscdebuild:nscdebuild "$source_tree"
          git config --global --add safe.directory "$source_tree"
          printf 'SOURCE_TREE=%s\n' "$source_tree" >> "$GITHUB_ENV"

      - name: Prepare and inspect Debian packaging tree
        id: packaging
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -e "$SOURCE_TREE/debian"
          cp -a "$SOURCE_TREE/pkg/debian" "$SOURCE_TREE/debian"
          chown -R nscdebuild:nscdebuild "$SOURCE_TREE/debian"
          test -f "$SOURCE_TREE/debian/control"
          test -f "$SOURCE_TREE/debian/changelog"
          test -x "$SOURCE_TREE/debian/rules"
          echo '=== package changelog metadata ==='
          dpkg-parsechangelog -l "$SOURCE_TREE/debian/changelog"
          echo '=== package stanzas and dependency declarations ==='
          grep -nE '^(Source|Package|Architecture|Build-Depends|Depends|Recommends|Suggests):' "$SOURCE_TREE/debian/control" || true
          echo '=== binary packages declared ==='
          awk '/^Package:/ {print $2}' "$SOURCE_TREE/debian/control"
          echo '=== packaging files ==='
          find "$SOURCE_TREE/debian" -maxdepth 2 -type f -printf '%P\n' | LC_ALL=C sort

      - name: Install declared Build-Depends
        id: builddeps
        if: ${{ steps.packaging.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp
          mk-build-deps --install --remove \
            --tool 'apt-get -y -o Acquire::Retries=3 --no-install-recommends' \
            "$SOURCE_TREE/debian/control"
          dpkg-checkbuilddeps "$SOURCE_TREE/debian/control"

      - name: Snapshot compiler, repositories and DEB toolchain
        if: ${{ steps.builddeps.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== operating system ==='; cat /etc/os-release
          echo '=== APT sources ==='; grep -RhvE '^[[:space:]]*(#|$)' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true
          echo '=== compiler ==='; gcc --version; gcc -v 2>&1
          echo '=== linker ==='; ld --version | head -n 2
          echo '=== Debian build tools ==='; dpkg --version | head -n 2; dpkg-buildpackage --version; dh --version 2>/dev/null || true; make --version | head -n 2; autoconf --version | head -n 2 || true; automake --version | head -n 2 || true; python3 --version
          echo '=== exact core package versions ==='
          dpkg-query -W -f='${binary:Package}\t${Version}\n' build-essential gcc libc6 binutils make autoconf automake debhelper devscripts dpkg-dev fakeroot python3 ksh93u+m gettext 2>/dev/null || true
          echo '=== Build-Depends consistency ==='; dpkg-checkbuilddeps "$SOURCE_TREE/debian/control"
          echo '=== relevant build variables ==='
          printf 'CC=%s\nCXX=%s\nCPPFLAGS=%s\nCFLAGS=%s\nCXXFLAGS=%s\nLDFLAGS=%s\nPATH=%s\n' "${CC-}" "${CXX-}" "${CPPFLAGS-}" "${CFLAGS-}" "${CXXFLAGS-}" "${LDFLAGS-}" "$PATH"

      - name: Build NsCDE binary packages with log capture
        id: deb_build
        if: ${{ steps.builddeps.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          build_path=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          set +e
          runuser -u nscdebuild -- env HOME=/home/nscdebuild PATH="$build_path" DEBIAN_FRONTEND=noninteractive \
            bash -lc "cd '$SOURCE_TREE' && dpkg-buildpackage -b -us -uc" \
            2>&1 | tee "$RUNNER_TEMP/nscde-dpkg-buildpackage.log"
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Analyze NsCDE DEB build log
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/analyze-build-log.py" \
            --log "$RUNNER_TEMP/nscde-dpkg-buildpackage.log" \
            --label 'NsCDE DEB build / Ubuntu 26.04' \
            --output-dir "$RUNNER_TEMP/ci-diagnostics/build" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Collect and inspect DEB artifacts
        id: deb_artifacts
        if: ${{ steps.deb_build.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          find /home/nscdebuild -maxdepth 1 -type f \( -name 'nscde*.deb' -o -name 'nscde*.ddeb' -o -name 'nscde*.changes' -o -name 'nscde*.buildinfo' \) -exec cp -v '{}' "$GITHUB_WORKSPACE/out/" ';'
          shopt -s nullglob
          debs=("$GITHUB_WORKSPACE"/out/*.deb)
          test "${#debs[@]}" -gt 0
          expected_packages=(nscde nscde-data nscde-icon-theme nscde-doc)
          for expected in "${expected_packages[@]}"; do
            found=0
            for package in "${debs[@]}"; do [[ "$(dpkg-deb -f "$package" Package)" != "$expected" ]] || ((found += 1)); done
            if (( found != 1 )); then echo "ERROR: expected exactly one .deb for $expected, found $found" >&2; exit 1; fi
          done
          echo '=== generated artifacts ==='; find "$GITHUB_WORKSPACE/out" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort
          echo '=== SHA256 ==='; sha256sum "$GITHUB_WORKSPACE"/out/*
          echo '=== package metadata ==='
          for package in "${debs[@]}"; do echo; echo "--- $package ---"; dpkg-deb -f "$package" Package Version Architecture Depends Recommends Suggests; dpkg-deb --info "$package" | sed -n '1,80p'; done

      - name: Collect DEB build stage summary
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo '## Ubuntu 26.04 DEB build result'; echo; echo '| Stage | Outcome |'; echo '|---|---|'
            printf '| Packaging metadata | `%s` |\n' '${{ steps.packaging.outcome }}'
            printf '| Build-Depends | `%s` |\n' '${{ steps.builddeps.outcome }}'
            printf '| DEB build | `%s` |\n' '${{ steps.deb_build.outcome }}'
            printf '| DEB artifact inspection | `%s` |\n' '${{ steps.deb_artifacts.outcome }}'
            echo; echo 'The packages are built from a clean detached clone of the exact CI commit by an unprivileged build user. Build logs are analyzed for root compiler/linker failures before recursive Make noise.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload DEB artifacts
        if: ${{ steps.deb_artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nscde-ubuntu-26.04-${{ env.TARGET_SHA }}
          path: out/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Prepare DEB diagnostic artifact bundle
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          bundle="$RUNNER_TEMP/ci-diagnostics/raw"; mkdir -p "$bundle"
          test ! -f "$RUNNER_TEMP/nscde-dpkg-buildpackage.log" || cp -a "$RUNNER_TEMP/nscde-dpkg-buildpackage.log" "$bundle/"
          if test -n "${SOURCE_TREE-}" && test -d "$SOURCE_TREE/debian"; then cp -a "$SOURCE_TREE/debian/control" "$bundle/debian-control" || true; cp -a "$SOURCE_TREE/debian/changelog" "$bundle/debian-changelog" || true; cp -a "$SOURCE_TREE/debian/rules" "$bundle/debian-rules" || true; fi
          {
            echo '=== NsCDE commit ==='; git -C "$GITHUB_WORKSPACE" show --no-patch --format='%H%n%aI%n%an <%ae>%n%s' HEAD || true
            echo '=== operating system ==='; cat /etc/os-release || true
            echo '=== APT sources ==='; grep -RhvE '^[[:space:]]*(#|$)' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true
            echo '=== compiler ==='; gcc --version || true
            echo '=== Debian tools ==='; dpkg --version | head -n 2 || true; dpkg-buildpackage --version || true
            echo '=== installed build packages ==='; dpkg-query -W -f='${binary:Package}\t${Version}\n' 2>/dev/null | LC_ALL=C sort || true
            echo '=== environment ==='; env | LC_ALL=C sort || true
          } > "$bundle/environment.txt"

      - name: Upload DEB diagnostic artifact bundle
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nscde-ubuntu-26.04-build-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-diagnostics
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      - name: Final DEB build diagnostic gate
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          packaging='${{ steps.packaging.outcome }}'; builddeps='${{ steps.builddeps.outcome }}'; build='${{ steps.deb_build.outcome }}'; artifacts='${{ steps.deb_artifacts.outcome }}'
          printf 'packaging=%s builddeps=%s build=%s artifacts=%s\n' "$packaging" "$builddeps" "$build" "$artifacts"
          test "$packaging" = success; test "$builddeps" = success; test "$build" = success; test "$artifacts" = success

  test-install:
    name: Install and diagnose NsCDE DEBs on clean Ubuntu 26.04
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ubuntu:26.04

    steps:
      - name: Show pristine Ubuntu 26.04 runtime container
        shell: bash
        run: |
          set -Eeuo pipefail
          cat /etc/os-release; uname -a; printf 'Architecture: %s\n' "$(dpkg --print-architecture)"

      - name: Install runtime diagnostic prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends ca-certificates file findutils
          apt-get clean

      - name: Download DEB artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nscde-ubuntu-26.04-${{ env.TARGET_SHA }}
          path: artifact

      - name: Inspect downloaded packages
        id: downloaded
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          find artifact -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort
          shopt -s nullglob; debs=(artifact/*.deb); test "${#debs[@]}" -gt 0
          expected_packages=(nscde nscde-data nscde-icon-theme nscde-doc)
          for expected in "${expected_packages[@]}"; do found=0; for package in "${debs[@]}"; do [[ "$(dpkg-deb -f "$package" Package)" != "$expected" ]] || ((found += 1)); done; test "$found" -eq 1; done
          for package in "${debs[@]}"; do echo; echo "--- $package ---"; dpkg-deb -f "$package" Package Version Architecture Depends Recommends Suggests; done

      - name: Verify clean pre-install state
        id: clean_state
        if: ${{ steps.downloaded.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          for package in nscde nscde-data nscde-icon-theme nscde-doc; do if dpkg-query -W -f='${db:Status-Status}\n' "$package" 2>/dev/null | grep -qx installed; then echo "ERROR: $package is already installed" >&2; exit 1; fi; done

      - name: Install generated DEBs with log capture
        id: install
        if: ${{ steps.clean_state.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob; debs=(artifact/*.deb); install_debs=(); for package in "${debs[@]}"; do install_debs+=("$(readlink -f "$package")"); done
          set +e
          { apt-get -o Acquire::Retries=3 update; apt-get -o Acquire::Retries=3 install -y --no-install-recommends "${install_debs[@]}"; } 2>&1 | tee "$RUNNER_TEMP/nscde-deb-install.log"
          status=${PIPESTATUS[0]}; set -e; exit "$status"

      - name: Verify installed DEB packages
        id: package_verify
        if: ${{ steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          dpkg-query -W -f='${binary:Package}\t${Version}\t${Architecture}\t${db:Status-Status}\n' nscde nscde-data nscde-icon-theme nscde-doc
          apt-get check; dpkg --audit; dpkg -V nscde nscde-data nscde-icon-theme nscde-doc

      - name: Verify installed NsCDE tree and runtime linkage
        id: runtime_verify
        if: ${{ steps.package_verify.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          required_paths=(/usr/bin/nscde /usr/bin/nscde_fvwmclnt /usr/share/xsessions/nscde.desktop /usr/share/NsCDE)
          for path in "${required_paths[@]}"; do test -e "$path" || { echo "ERROR: missing installed path: $path" >&2; exit 1; }; ls -ld "$path"; done
          package_paths="$RUNNER_TEMP/nscde-package-paths.txt"; : > "$package_paths"; for package in nscde nscde-data nscde-icon-theme nscde-doc; do dpkg -L "$package" >> "$package_paths"; done; LC_ALL=C sort -u -o "$package_paths" "$package_paths"
          elf_count=0
          while IFS= read -r candidate; do test -f "$candidate" || continue; file -b "$candidate" | grep -q '^ELF ' || continue; ((elf_count += 1)); dependencies="$(ldd "$candidate" 2>&1 || true)"; if grep -q '=> not found' <<<"$dependencies"; then echo "ERROR: unresolved runtime dependency: $candidate" >&2; printf '%s\n' "$dependencies" >&2; exit 1; fi; done < "$package_paths"
          test "$elf_count" -gt 0
          broken_links=0; while IFS= read -r candidate; do test -L "$candidate" || continue; if ! test -e "$candidate"; then printf 'ERROR: broken link: %s -> %s\n' "$candidate" "$(readlink "$candidate")" >&2; broken_links=1; fi; done < "$package_paths"; test "$broken_links" -eq 0; printf 'ELF files checked: %d\n' "$elf_count"

      - name: Snapshot resolved NsCDE runtime providers
        id: providers
        if: ${{ steps.package_verify.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          for package in nscde nscde-data nscde-icon-theme nscde-doc; do echo; echo "--- $package ---"; dpkg-query -W -f='Depends: ${Depends}\nRecommends: ${Recommends}\nSuggests: ${Suggests}\n' "$package"; done
          apt-cache depends --installed nscde nscde-data nscde-icon-theme nscde-doc || true

      - name: Collect DEB installation stage summary
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo '## Ubuntu 26.04 DEB clean-install result'; echo; echo '| Stage | Outcome |'; echo '|---|---|'
            printf '| Downloaded artifact inspection | `%s` |\n' '${{ steps.downloaded.outcome }}'
            printf '| Clean pre-install state | `%s` |\n' '${{ steps.clean_state.outcome }}'
            printf '| Package installation | `%s` |\n' '${{ steps.install.outcome }}'
            printf '| dpkg/APT verification | `%s` |\n' '${{ steps.package_verify.outcome }}'
            printf '| Installed tree / ELF linkage | `%s` |\n' '${{ steps.runtime_verify.outcome }}'
            printf '| Runtime provider snapshot | `%s` |\n' '${{ steps.providers.outcome }}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare installation diagnostic artifact bundle
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          bundle="$RUNNER_TEMP/ci-diagnostics/install"; mkdir -p "$bundle"
          test ! -f "$RUNNER_TEMP/nscde-deb-install.log" || cp -a "$RUNNER_TEMP/nscde-deb-install.log" "$bundle/"
          test ! -f "$RUNNER_TEMP/nscde-package-paths.txt" || cp -a "$RUNNER_TEMP/nscde-package-paths.txt" "$bundle/"
          { echo '=== operating system ==='; cat /etc/os-release || true; echo '=== installed NsCDE packages ==='; dpkg-query -W -f='${binary:Package}\t${Version}\t${Architecture}\t${db:Status-Status}\n' nscde nscde-data nscde-icon-theme nscde-doc 2>/dev/null || true; echo '=== dependency consistency ==='; apt-get check || true; echo '=== dpkg audit ==='; dpkg --audit || true; echo '=== package ownership ==='; dpkg -S /usr/bin/nscde /usr/bin/nscde_fvwmclnt /usr/share/xsessions/nscde.desktop 2>/dev/null || true; echo '=== environment ==='; env | LC_ALL=C sort || true; } > "$bundle/environment.txt"

      - name: Upload installation diagnostic artifact bundle
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nscde-ubuntu-26.04-install-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-diagnostics
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      - name: Final DEB installation diagnostic gate
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          downloaded='${{ steps.downloaded.outcome }}'; clean='${{ steps.clean_state.outcome }}'; install='${{ steps.install.outcome }}'; package_verify='${{ steps.package_verify.outcome }}'; runtime_verify='${{ steps.runtime_verify.outcome }}'; providers='${{ steps.providers.outcome }}'
          printf 'downloaded=%s clean=%s install=%s package_verify=%s runtime_verify=%s providers=%s\n' "$downloaded" "$clean" "$install" "$package_verify" "$runtime_verify" "$providers"
          test "$downloaded" = success; test "$clean" = success; test "$install" = success; test "$package_verify" = success; test "$runtime_verify" = success; test "$providers" = success
